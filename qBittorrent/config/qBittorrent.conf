[Application]
MemoryWorkingSetLimit=256         # 256: র‍্যামের সর্বোচ্চ সীমা ২৫৬ এমবি করা হলো (Heroku-র জন্য এটি একদম সেফ ও ব্যালেন্সড)

[BitTorrent]
Session\AddExtensionToIncompleteFiles=true
Session\AddTrackersEnabled=false
Session\AnnounceToAllTrackers=false
Session\AnonymousModeEnabled=false
Session\AsyncIOThreadsCount=4      # 4: ২ থেকে বাড়িয়ে ৪ করা হলো, ২৫৬ এমবি র‍্যামের সাথে এটি ভালো স্পিড দেবে
Session\ConnectionSpeed=30         # 30: কানেকশন স্পিড সামান্য বাড়ানো হলো
Session\DHTEnabled=true
Session\DiskCacheSize=32           # 32: ক্যাশ ৩২ এমবি করা হলো, যা ২৫৬ এমবি র‍্যামের ভেতর সহজেই ফিট হয়ে যাবে
Session\DiskCacheTTL=30            # 30: ক্যাশ ৩০ সেকেন্ড পর পর ডিস্কে রাইট হবে
Session\GlobalDLSpeedLimit=0
Session\GlobalMaxRatio=-1
Session\GlobalMaxSeedingMinutes=-1
Session\GlobalUPSpeedLimit=0
Session\HashingThreadsCount=1
Session\IgnoreSlowTorrentsForQueueing=true
Session\IncludeOverheadInLimits=false
Session\LSDEnabled=false
Session\MaxActiveCheckingTorrents=1
Session\MaxActiveDownloads=2       # 2: একসাথে ডাউনলোড ২টিই রাখা ভালো, যাতে CPU ১০০% না হয়
Session\MaxActiveTorrents=4        # 4: মোট একটিভ টরেন্ট ৪টি করা হলো
Session\MaxActiveUploads=1
Session\MaxConnections=60          # 60: কানেকশন ৪০ থেকে বাড়িয়ে ৬০ করা হলো
Session\MaxConnectionsPerTorrent=30 # 30: প্রতি টরেন্টে কানেকশন ৩০ টি করা হলো
Session\MaxRatioAction=0
Session\MaxUploads=2
Session\MaxUploadsPerTorrent=2
Session\MultiConnectionsPerIp=true
Session\PexEnabled=true
Session\PerformanceWarning=false
Session\Preallocation=false
Session\QueueingSystemEnabled=true
Session\SlowTorrentsDownloadRate=2
Session\SlowTorrentsInactivityTimer=600
Session\SlowTorrentsUploadRate=2
Session\StopTrackerTimeout=5
TrackerEnabled=true

[LegalNotice]
Accepted=true

[Meta]
MigrationVersion=4

[Preferences]
Advanced\DisableRecursiveDownload=false
Advanced\RecheckOnCompletion=false
Advanced\trackerPortForwarding=false
General\PreventFromSuspendWhenDownloading=true
General\PreventFromSuspendWhenSeeding=true
Search\SearchEnabled=false
WebUI\BanDuration=3600
WebUI\CSRFProtection=false
WebUI\ClickjackingProtection=false
WebUI\Enabled=true
WebUI\HTTPS\Enabled=false
WebUI\HostHeaderValidation=false
WebUI\LocalHostAuth=false
WebUI\MaxAuthenticationFailCount=10
WebUI\Port=8090
WebUI\SecureCookie=false
WebUI\SessionTimeout=3600
WebUI\UseUPnP=false
