# --- Heroku Optimized Aria2 Configuration ---
allow-overwrite=true
auto-file-renaming=true
bt-detach-seed-only=true
bt-enable-lpd=false                # FALSE: লোকাল পিয়ার খোঁজা বন্ধ করবে (সিপিপিইউ বাঁচাবে)
bt-remove-unselected-file=true
check-certificate=false
check-integrity=false              # FALSE: ডাউনলোড শেষে ফাইল চেক করা বন্ধ করবে (র‍্যাম ও সিপিপিইউ বাঁচাবে)
continue=true
content-disposition-default-utf8=true
daemon=true

# --- Memory (RAM) Control ---
disk-cache=0M                      # 0M: র‍্যামে ডাটা ক্যাশ না রেখে সরাসরি ডিস্কে লিখবে (র‍্যাম সবচেয়ে কম লাগবে)
rpc-max-request-size=10M           # 10M: ১ জিবি থেকে কমিয়ে ১০ এমবি করা হয়েছে, যাতে র‍্যাম লোড না হয়

# --- Connection & CPU Control ---
enable-rpc=true
follow-torrent=mem
force-save=true
http-accept-gzip=true
max-connection-per-server=4       # 4: ১০ থেকে কমিয়ে ৪ করা হয়েছে (কানেকশন কমলে সিপিপিইউ শান্ত থাকবে)
max-concurrent-downloads=2         # 2: একসাথে ১০টি ডাউনলোডের বদলে ২টি হবে (হিরোকুর জন্য এটিই সেফ)
split=4                            # 4: কানেকশন স্প্লিট ৪ করা হয়েছে (সিপিপিইউ থ্রোটলিং আটকাবে)
max-file-not-found=0
max-tries=10                       # 10: ২০ থেকে কমিয়ে ১০ করা হলো
min-split-size=20M                 # 20M: ছোট ফাইলের জন্য বাড়তি কানেকশন তৈরি করা বন্ধ করবে

# --- Network & Identity ---
netrc-path=/usr/src/app/.netrc
optimize-concurrent-downloads=false # FALSE: অটো-অপ্টিমাইজেশন লুপ বন্ধ করে সিপিপিইউ বাঁচাবে
peer-id-prefix=-qB4430-
peer-agent=qBittorrent/4.4.3
quiet=true
reuse-uri=true
seed-ratio=0
summary-interval=0
user-agent=Wget/1.12
